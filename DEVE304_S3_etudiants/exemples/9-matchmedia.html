<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Une media query en JavaScript</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #F7F5EF; color: #1F2A44; }
    #largeur { position: fixed; right: 8px; bottom: 8px; background: #1F2A44; color: #fff;
               padding: 4px 10px; border-radius: 6px; font: 14px monospace; margin: 0; }
    /* ----- le code de la diapo ----- */
    #etat { font-size: 2rem; font-weight: bold; color: #1F2A44; }
  </style>
</head>
<body>
  <h1>Quel écran ?</h1>
  <p id="etat"></p>
  <p id="largeur"></p>
  <script>
    // Affiche la largeur de la fenêtre en bas à droite, pour vos essais
    function montrer() { document.querySelector("#largeur").textContent = window.innerWidth + " px"; }
    window.addEventListener("resize", montrer); montrer();
  </script>
  <script>
    const mq = window.matchMedia("(min-width: 768px)");

    function maj(e) {
      document.querySelector("#etat").textContent =
        e.matches ? "Grand écran" : "Téléphone";
    }

    mq.addEventListener("change", maj);
    maj(mq);
  </script>
</body>
</html>
