<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Les préférences de l'utilisateur</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #F7F5EF; color: #1F2A44; }
    #largeur { position: fixed; right: 8px; bottom: 8px; background: #1F2A44; color: #fff;
               padding: 4px 10px; border-radius: 6px; font: 14px monospace; margin: 0; }
    /* ----- le code de la diapo ----- */
    .carre { width: 80px; height: 80px; background: #5FD3A0; margin: 24px; animation: tourne 2s linear infinite; }
    @keyframes tourne { to { transform: rotate(360deg); } }

    @media (prefers-color-scheme: dark) {
      body { background: #1F2A44; color: #F7F5EF; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <h1>Mes réglages</h1>
  <p>Le carré tourne… sauf si on demande moins d'animations.</p>
  <div class="carre"></div>
  <p id="largeur"></p>
  <script>
    // Affiche la largeur de la fenêtre en bas à droite, pour vos essais
    function montrer() { document.querySelector("#largeur").textContent = window.innerWidth + " px"; }
    window.addEventListener("resize", montrer); montrer();
  </script>
</body>
</html>
