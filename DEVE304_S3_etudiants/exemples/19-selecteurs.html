<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Les sélecteurs CSS3</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #F7F5EF; color: #1F2A44; }
    #largeur { position: fixed; right: 8px; bottom: 8px; background: #1F2A44; color: #fff;
               padding: 4px 10px; border-radius: 6px; font: 14px monospace; margin: 0; }
    /* ----- le code de la diapo ----- */
    .carte { padding: 12px; margin-bottom: 8px; background: #fff; border-radius: 8px; }
    .carte:nth-child(even) { background: #DCF5EA; }     /* ----- odd = impair
Cible les éléments en 1re, 3e, 5e, 7e... position.       //    even = pair
Cible les éléments en 2e, 4e, 6e, 8e... position. ----- */
    .carte:first-child { border-left: 6px solid #2E8B65; }
    a[href^="https"]::after { content: " (externe)"; }
    input:focus { outline: 3px solid #5FD3A0; }
    .bouton:not(.actif) { opacity: 0.5; }
    @media (hover: none ) and ( pointer:coarse){
      .bouton {
        padding: 14px 24px;
        font-size: 1.1rem;
      }
    }/* : la règle cible les appareils tactiles sans souris — typiquement smartphones et tablettes. C'est le cas classique d'un écran tactile pur.  sur mobile, on tient l'écran à distance et le texte un peu plus grand améliore la lisibilité et le confort de lecture.*/
    @media (prefers-color-scheme: dark){
      body {
        background: #1F2A44; color : #F7F5EF;
      }

    }
    @media (prefers-reduced-motion: reduce {
      *{
        animation: none !important;
        transition: none !important;
      }
    }
    @media (orientation: landscape) and ( max-height : 500px) {
           
      header { position : static ; height: 60px;


      .hero {
        height: 60vh;
      }}
    }
  </style>
</head>
