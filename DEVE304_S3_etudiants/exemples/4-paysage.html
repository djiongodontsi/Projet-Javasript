<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Téléphone tourné : paysage</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #F7F5EF; color: #1F2A44; }
    #largeur { position: fixed; right: 8px; bottom: 8px; background: #1F2A44; color: #fff;
               padding: 4px 10px; border-radius: 6px; font: 14px monospace; margin: 0; }
    /* ----- le code de la diapo ----- */
    body { padding: 0; }
    header { position: sticky; top: 0; height: 120px; background: #1F2A44; color: #fff;
             display: flex; align-items: center; padding: 0 16px; }
    .hero  { height: 80vh; background: #5FD3A0; display: grid; place-items: center; font-size: 2rem; }
    .texte { padding: 16px; height: 150vh; }

    @media (orientation: landscape) and (max-height: 500px) {
      header { position: static; height: 60px; }
      .hero  { height: 60vh; }
    }
  </style>
</head>
<body>
  <header><strong>EPSI Salles</strong></header>
  <div class="hero">Réservez une salle</div>
  <div class="texte">Faites défiler la page…</div>
  <p id="largeur"></p>
  <script>
    // Affiche la largeur de la fenêtre en bas à droite, pour vos essais
    function montrer() { document.querySelector("#largeur").textContent = window.innerWidth + " px"; }
    window.addEventListener("resize", montrer); montrer();
  </script>
</body>
</html>
