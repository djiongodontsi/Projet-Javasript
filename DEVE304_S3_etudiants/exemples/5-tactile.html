<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doigt ou souris : hover et pointer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #F7F5EF; color: #1F2A44; }
    #largeur { position: fixed; right: 8px; bottom: 8px; background: #1F2A44; color: #fff;
               padding: 4px 10px; border-radius: 6px; font: 14px monospace; margin: 0; }
    /* ----- le code de la diapo ----- */
    .bouton { padding: 6px 12px; border: 2px solid #1F2A44; background: #fff; border-radius: 6px; margin: 4px; }
    .bouton:hover { background: #5FD3A0; }

    @media (hover: none) and (pointer: coarse) {
      .bouton {
        padding: 14px 24px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <h1>Réserver</h1>
  <button class="bouton">Turing</button>
  <button class="bouton">Lovelace</button>
  <button class="bouton">Hopper</button>
  <p id="largeur"></p>
  <script>
    // Affiche la largeur de la fenêtre en bas à droite, pour vos essais
    function montrer() { document.querySelector("#largeur").textContent = window.innerWidth + " px"; }
    window.addEventListener("resize", montrer); montrer();
  </script>
</body>
</html>
